name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'clinic-saas/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'clinic-saas/**'

jobs:
  backend:
    name: Backend – Test & Docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run tests (Testcontainers spins up PostgreSQL)
        working-directory: clinic-saas/backend
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Build Docker image
        working-directory: clinic-saas/backend
        run: docker build -t clinic-saas-backend:${{ github.sha }} .

  frontend:
    name: Frontend – Build & Docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: clinic-saas/frontend/package-lock.json

      - name: Install dependencies
        working-directory: clinic-saas/frontend
        run: npm ci

      - name: Build production bundle
        working-directory: clinic-saas/frontend
        run: npm run build -- --configuration production

      - name: Build Docker image
        working-directory: clinic-saas/frontend
        run: docker build -t clinic-saas-frontend:${{ github.sha }} .

  compose-check:
    name: Docker Compose config check
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        working-directory: clinic-saas
        run: docker compose config --quiet
