spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/helpdesk
    username: ${DB_USER:helpdesk}
    password: ${DB_PASS:helpdesk}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  web:
    cors:
      allowed-origins: ${FRONTEND_URL:http://localhost:4200}

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-characters-long}
    access-expiry: 3600000
    refresh-expiry: 604800000
  upload:
    path: ${UPLOAD_PATH:./uploads}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  sla:
    check-interval-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
