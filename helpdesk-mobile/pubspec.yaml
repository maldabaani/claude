name: helpdesk_mobile
description: NG HelpDesk App — Customer, Agent & Admin portal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  go_router: ^14.1.4
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  timeago: ^3.6.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
