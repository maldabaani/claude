<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Local Ollama Chat</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 40px auto; background: #f5f5f5; }
  h1 { font-size: 18px; }
  #log { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 16px; min-height: 300px; max-height: 60vh; overflow-y: auto; margin-bottom: 12px; }
  .msg { margin-bottom: 14px; white-space: pre-wrap; }
  .user { color: #1d4ed8; font-weight: 600; }
  .assistant { color: #111; }
  .role { font-size: 11px; text-transform: uppercase; color: #888; margin-bottom: 2px; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  select, button { padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
  button { background: #2563eb; color: white; border: none; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { font-size: 12px; color: #888; margin-bottom: 8px; }
</style>
</head>
<body>
  <h1>Local Ollama Chat</h1>
  <div id="status">Checking connection to http://localhost:11434 ...</div>
  <select id="model">
    <option value="llama3.2:1b">llama3.2:1b</option>
    <option value="phi3:mini">phi3:mini</option>
    <option value="gemma2:2b">gemma2:2b</option>
  </select>
  <div id="log"></div>
  <form id="form">
    <input type="text" id="input" placeholder="Say something..." autocomplete="off" />
    <button type="submit" id="send">Send</button>
  </form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const modelSelect = document.getElementById('model');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const history = [];

function addMessage(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg';
  wrap.innerHTML = `<div class="role">${role}</div><div class="${role === 'user' ? 'user' : 'assistant'}"></div>`;
  wrap.querySelector('div.user, div.assistant').textContent = text;
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return wrap.querySelector('div.user, div.assistant');
}

fetch('http://localhost:11434/api/tags')
  .then(r => r.ok ? statusEl.textContent = 'Connected to local Ollama.' : Promise.reject())
  .catch(() => statusEl.textContent = 'Could not reach http://localhost:11434 - is "ollama serve" running?');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  addMessage('user', text);
  history.push({ role: 'user', content: text });
  const replyEl = addMessage('assistant', '...');

  try {
    const res = await fetch('http://localhost:11434/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: modelSelect.value, messages: history, stream: true }),
    });
    if (!res.ok) {
      const err = await res.text();
      replyEl.textContent = 'Error: ' + err;
      sendBtn.disabled = false;
      return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = '';
    replyEl.textContent = '';
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const obj = JSON.parse(line);
        if (obj.message?.content) {
          full += obj.message.content;
          replyEl.textContent = full;
          log.scrollTop = log.scrollHeight;
        }
      }
    }
    history.push({ role: 'assistant', content: full });
  } catch (err) {
    replyEl.textContent = 'Error: ' + err.message;
  }
  sendBtn.disabled = false;
});
</script>
</body>
</html>
