<form [formGroup]="form" (ngSubmit)="submit()" class="login-form">

  @if (errorMsg) {
    <div class="error-banner">
      <i class="pi pi-exclamation-circle"></i>
      <span>{{ errorMsg }}</span>
    </div>
  }

  <div class="field">
    <label for="email">
      <i class="pi pi-envelope field-icon"></i>
      Email address
    </label>
    <input pInputText id="email" formControlName="email" type="email"
           placeholder="doctor@clinic.com" class="w-full" autocomplete="email" />
    @if (form.get('email')?.invalid && form.get('email')?.touched) {
      <small class="field-error"><i class="pi pi-times-circle"></i> Valid email required</small>
    }
  </div>

  <div class="field">
    <div class="label-row">
      <label for="password">
        <i class="pi pi-lock field-icon"></i>
        Password
      </label>
    </div>
    <p-password id="password" formControlName="password"
                [feedback]="false" [toggleMask]="true"
                styleClass="w-full" inputStyleClass="w-full"
                placeholder="••••••••" />
  </div>

  <div class="field">
    <label for="tenantId">
      <i class="pi pi-building field-icon"></i>
      Clinic ID
      <span class="optional">— leave blank for platform admin</span>
    </label>
    <input pInputText id="tenantId" formControlName="tenantId"
           placeholder="e.g. aster_clinic" class="w-full" autocomplete="off" />
  </div>

  <p-button type="submit" label="Sign In" icon="pi pi-arrow-right"
            iconPos="right" styleClass="w-full sign-btn" [loading]="loading" />

</form>
