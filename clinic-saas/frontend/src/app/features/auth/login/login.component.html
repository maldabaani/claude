<form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
  <h2 class="form-title">Sign In</h2>

  @if (errorMsg) {
    <p-message severity="error" [text]="errorMsg" styleClass="w-full mb-3" />
  }

  <div class="field">
    <label for="email">Email</label>
    <input pInputText id="email" formControlName="email" type="email"
           placeholder="doctor@clinic.com" class="w-full" />
    @if (form.get('email')?.invalid && form.get('email')?.touched) {
      <small class="error">Valid email required</small>
    }
  </div>

  <div class="field">
    <label for="password">Password</label>
    <p-password id="password" formControlName="password"
                [feedback]="false" [toggleMask]="true"
                styleClass="w-full" inputStyleClass="w-full" />
  </div>

  <div class="field">
    <label for="tenantId">Clinic ID <span class="optional">(leave blank for platform admin)</span></label>
    <input pInputText id="tenantId" formControlName="tenantId"
           placeholder="e.g. my_clinic_db" class="w-full" />
  </div>

  <p-button type="submit" label="Sign In" icon="pi pi-sign-in"
            styleClass="w-full mt-2" [loading]="loading" />
</form>
