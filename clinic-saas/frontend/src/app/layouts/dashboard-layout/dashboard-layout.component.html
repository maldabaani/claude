<div class="layout-wrapper">

  <!-- Sidebar -->
  <nav class="layout-sidebar">

    <div class="sidebar-logo">
      <div class="logo-icon"><i class="pi pi-heart-fill"></i></div>
      <div class="logo-text">
        <span class="logo-name">Clinic SaaS</span>
        <span class="logo-sub">Management Platform</span>
      </div>
    </div>

    <div class="nav-section">
      @for (item of navItems; track item.label) {
        <a [routerLink]="item.routerLink" routerLinkActive="active" class="nav-item">
          <div class="nav-icon"><i [class]="item.icon"></i></div>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </div>

    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">{{ userInitial }}</div>
        <div class="user-info">
          <div class="user-email">{{ userEmail }}</div>
          <div class="user-role">{{ userRole }}</div>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()">
        <i class="pi pi-sign-out"></i>
        <span>Sign Out</span>
      </button>
    </div>

  </nav>

  <!-- Main -->
  <div class="layout-main">
    <header class="layout-topbar">
      <div class="topbar-left">
        <span class="topbar-title">{{ clinicName }}</span>
      </div>
      <div class="topbar-right">
        <span class="topbar-date">{{ today }}</span>
        <div class="topbar-user">
          <div class="user-bubble">{{ userInitial }}</div>
          <span class="user-label">{{ userEmail }}</span>
        </div>
      </div>
    </header>
    <main class="layout-content">
      <router-outlet />
    </main>
  </div>

</div>
