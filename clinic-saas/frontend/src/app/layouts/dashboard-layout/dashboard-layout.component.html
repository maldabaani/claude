<div class="layout-wrapper">

  <!-- Sidebar -->
  <nav class="layout-sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><i class="pi pi-heart-fill"></i></div>
      <span>Clinic SaaS</span>
    </div>

    <span class="nav-section-label">Main Menu</span>
    <ul class="nav-list">
      @for (item of navItems; track item.label) {
        <li>
          <a [routerLink]="item.routerLink" routerLinkActive="active" class="nav-item">
            <i [class]="item.icon"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>

    <div class="sidebar-footer">
      <div class="user-avatar-sm">{{ userInitial }}</div>
      <div class="user-text">
        <div class="user-name">{{ userEmail }}</div>
        <div class="user-role">{{ userRole }}</div>
      </div>
      <button pButton icon="pi pi-sign-out" class="p-button-text logout-btn"
              (click)="logout()" title="Logout"></button>
    </div>
  </nav>

  <!-- Main area -->
  <div class="layout-main">
    <header class="layout-topbar">
      <div class="topbar-left">
        <span class="topbar-title">{{ clinicName }}</span>
      </div>
      <div class="topbar-right">
        <span class="topbar-date">{{ today }}</span>
        <div class="topbar-user">
          <div class="user-bubble">{{ userInitial }}</div>
          <span class="user-label">{{ userEmail }}</span>
        </div>
      </div>
    </header>
    <main class="layout-content">
      <router-outlet />
    </main>
  </div>

</div>
